    exitDoor.pivots.forEach(function (d) { d.g.rotation.y = d.sg * exitDoor.amt * exitDoor.open; });

    gAmt += (tgt - gAmt) * Math.min(1, dt * 3);
    var g = gAmt;
    hemiG.intensity = 1.0 * g; moonG.intensity = 0.8 * g;
    fountainLight.intensity = (0.95 + Math.sin(t * 3) * 0.05) * g;
    lampLightA.intensity = 1.0 * g; lampLightB.intensity = 1.0 * g;
    dispLights.forEach(function (l) { l.intensity = 0.9 * g; });
    scene.fog.color.copy(fogIn).lerp(fogOut, g); scene.fog.near = 16 + 6 * g; scene.fog.far = 38 + 40 * g;
    skyDome.visible = g > 0.01; skyDome.position.copy(camera.position);
    flies.material.opacity = 0.9 * g;

    if (g > 0.01) {
      fnt.step(dt);
      fnt.waterMap.offset.set(t * 0.012, t * 0.017);
      fnt.sheets.forEach(function (tx) { tx.offset.y = -(t * 1.3) % 1; });
      fnt.ripples.forEach(function (r, i) {
        var ph = (t * 0.45 + i / fnt.ripples.length) % 1, sc = 1.25 + ph * 0.75;
        r.scale.set(sc, sc, 1); r.material.opacity = 0.32 * (1 - ph);
      });
      for (var i = 0; i < fliesPos.length; i += 3) {
        fliesPos[i] = fliesBase[i] + Math.sin(t * 0.5 + i) * 0.9;
        fliesPos[i + 1] = fliesBase[i + 1] + Math.sin(t * 0.8 + i * 1.3) * 0.4;
        fliesPos[i + 2] = fliesBase[i + 2] + Math.cos(t * 0.45 + i * 0.7) * 0.9;
      }
      flies.geometry.attributes.position.needsUpdate = true;
    }
  }

  var doorBump = false;
  function resolve(p, pr, prev) {
    var wasR1 = prev.x > PART_X, edge = 0.15 + pr;
    /* the shared wall: passable only through the doorway, and only when the door is open */
    if (p.x < PART_X + edge && p.x > PART_X - edge) {
      var inGap = Math.abs(p.z) < DOOR_HW - 0.2;
      if (!inGap || door.amt < 0.55) {
        p.x = wasR1 ? PART_X + edge : PART_X - edge;
        if (inGap) doorBump = true;
      }
    }
    if (p.x >= PART_X + edge - 0.001) {
      p.x = Math.min(p.x, HW - 0.7); p.z = clamp(p.z, -HD + 0.7, HD - 0.7);
    } else if (p.x <= PART_X - edge + 0.001) {
      resolveWest(p, pr, prev);
    } else {
      p.z = clamp(p.z, -DOOR_HW + 0.2, DOOR_HW - 0.2);
    }
    colliders.forEach(function (c) {
      if (c.t === 'c') {
        var dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = c.r + pr;
        if (d < m) { if (d < 1e-4) { dx = 1; dz = 0; d = 1; } p.x = c.x + dx / d * m; p.z = c.z + dz / d * m; }
      } else {
        var x0 = c.x0 - pr, x1 = c.x1 + pr, z0 = c.z0 - pr, z1 = c.z1 + pr;
        if (p.x > x0 && p.x < x1 && p.z > z0 && p.z < z1) {
          var dl = p.x - x0, dr = x1 - p.x, dt = p.z - z0, db = z1 - p.z, mn = Math.min(dl, dr, dt, db);
          if (mn === dl) p.x = x0; else if (mn === dr) p.x = x1; else if (mn === dt) p.z = z0; else p.z = z1;
        }
      }
    });
  }

  /* ---------- frame panel ---------- */
  var activeIdx = -1, pickIdx = -1, autoShown = -1;

  function updatePanel() {
    var i = activeIdx;
    /* Oddiy tomosha rejimida ramkaga yaqinlashganda pastki "Ramka 1/2" paneli chiqmaydi.
       Tahrirlash rejimida esa surat yuklash va izohni boshqarish paneli saqlanadi. */
    if (!editable || i < 0) { el.panel.hidden = true; return; }
    var s = state.frames[i], has = !!s.img;
    el.panel.hidden = false;
    el.pTitle.textContent = (!editable && s.cap) ? s.cap : 'Ramka ' + (i + 1);
    el.pState.textContent = has ? '' : (editable ? "Bo'sh" : "Hali bo'sh");
    el.pUpload.hidden = !editable;
    el.pUpload.textContent = has ? 'Almashtirish' : "Surat qo'shish";
    el.pClear.hidden = !(editable && has);
    el.pCap.hidden = !(editable && has);
    if (document.activeElement !== el.pCap) el.pCap.value = s.cap;
    if (editable && !has) el.pUpload.className = 'btn primary'; else el.pUpload.className = 'btn';
  }

  function interact() {
    if (lbOpen) { closeLightbox(); return; }
    if (letterOpen) { closeLetter(); return; }
    if (counterOpen) { closeCounter(); return; }
    if (started && seat.phase === 'sit' && curSeat && curSeat.name.indexOf('table-2-') === 0) {
      openLetter(); return;
    }
    if (seat.phase === 'sit') {
      toggleSit(); return;
    }
    if (seat.phase !== 'none') return;
    if (doorNear(1.7)) { toggleDoor(); return; }
    if (exitNear(1.7)) { toggleExit(); return; }
    if (seatNear(1.7)) { toggleSit(); return; }
    if (activeIdx < 0) return;
    if (state.frames[activeIdx].img) openLightbox(activeIdx);
  }
  /* o'tirgan holda suratlarni ko'rish: shu xonadagi ramkalar orasida almashtirish */
  function seatFrames() {
    var sd = sideOf(player.position.x), L = [], i;
    for (i = 0; i < frames.length; i++) if (frames[i].room === sd) L.push(i);
    var F = L.filter(function (j) { return state.frames[j].img; });
    return (editable || !F.length) ? L : F;
  }
  function faceFrame(j) {
    focusIdx = j;
    var g = frames[j].group.position;
    camGoal = Math.atan2(-(g.x - player.position.x), -(g.z - player.position.z));
  }
  function cycleFrame(d) {
    var L = seatFrames(); if (!L.length) return;
    var k = L.indexOf(focusIdx); k = k < 0 ? 0 : (k + d + L.length) % L.length;
    faceFrame(L[k]);
  }
  function lbStep(d) {
    var L = seatFrames().filter(function (j) { return state.frames[j].img; }); if (L.length < 2) return;
    var k = L.indexOf(focusIdx >= 0 ? focusIdx : activeIdx); k = (k + d + L.length) % L.length;
    faceFrame(L[k]); openLightbox(L[k]);
  }
  el.pPrev.addEventListener('click', function () { cycleFrame(-1); });
  el.pNext.addEventListener('click', function () { cycleFrame(1); });
  function openLightbox(i) {
    var s = state.frames[i]; if (!s.img) return;
    el.lbImg.src = s.img; el.lbCap.textContent = s.cap || '';
    el.lb.hidden = false; lbOpen = true; keys = {};
  }
  function closeLightbox() { if (!lbOpen) return; el.lb.hidden = true; lbOpen = false; }
  el.lb.addEventListener('click', function (e) { if (e.target !== el.lbImg) closeLightbox(); });
  el.lbClose.addEventListener('click', closeLightbox);
  el.pUpload.addEventListener('click', function () { if (activeIdx >= 0) pickFile(activeIdx); });
  el.pClear.addEventListener('click', function () {
    if (activeIdx < 0) return;
    state.frames[activeIdx] = { img: null, cap: '' };
    drawPlaque(activeIdx); loadFrameImage(activeIdx); markDirty(); updatePanel();
  });
  var capTimer = 0;
  el.pCap.addEventListener('input', function () {
    if (activeIdx < 0) return;
    state.frames[activeIdx].cap = el.pCap.value;
    drawPlaque(activeIdx);
    clearTimeout(capTimer);
    capTimer = setTimeout(markDirty, 350);
  });

  /* ---------- uploading ---------- */
  function pickFile(i) { pickIdx = i; el.file.click(); }
  function shrink(file, maxSide) {
    return new Promise(function (resolveP, rejectP) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var sc = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
        var c = mkCanvas(Math.max(1, Math.round(im.naturalWidth * sc)), Math.max(1, Math.round(im.naturalHeight * sc)));
        var g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        try { resolveP(c.toDataURL('image/jpeg', 0.82)); } catch (e) { rejectP(e); }
      };
      im.onerror = function () { URL.revokeObjectURL(url); rejectP(new Error('image')); };
      im.src = url;
    });
  }
  el.file.addEventListener('change', function () {
    var f = el.file.files && el.file.files[0];
    var idx = pickIdx;
    el.file.value = '';
    if (!f || idx < 0) return;
    shrink(f, 1100).then(function (url) {
      state.frames[idx].img = url;
      loadFrameImage(idx);
      markDirty();
      updatePanel();
    }).catch(function () { toast("Rasmni o'qib bo'lmadi. Boshqa surat tanlang."); });
  });

  /* ---------- saving ---------- */
  function refreshSaveBtn() {
    el.save.hidden = false;
    el.save.disabled = !dirty || saving;
    el.save.classList.toggle('dirty', dirty && !saving);
    el.save.textContent = saving ? 'Saqlanmoqda' : 'Saqlash';
  }
  function saveDraft() {
    try { localStorage.setItem(DRAFT, JSON.stringify(state)); }
    catch (e) {}
  }
  function markDirty() { dirty = true; refreshSaveBtn(); saveDraft(); }

  function buildDoc() {
    var reset = '';
    var rs = document.head && document.head.querySelector('style');
    if (rs) reset = rs.textContent;
    var parts = [
      document.querySelector('title').outerHTML,
      document.querySelector('meta[name="claude:viewport-fit-sides"]').outerHTML,
      document.querySelector('link[href*="fonts.googleapis.com"]').outerHTML,
      '<style id="css">' + document.getElementById('css').textContent + '</style>',
      document.getElementById('ui').outerHTML,
      '<script id="data" type="application/json">' + JSON.stringify(state).replace(/</g, '\\u003c') + '<\/script>',
      '<script src="./three.min.js"><\/script>',
      '<script id="app">' + document.getElementById('app').textContent + '<\/script>'
    ];
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' + parts.join('\n') + '</body></html>';
  }

  el.save.addEventListener('click', function () {
    if (!dirty || saving) return;
    saving = true; refreshSaveBtn();
    try {
      localStorage.setItem('xm_saved_state', JSON.stringify(state));
      localStorage.setItem(DRAFT, JSON.stringify(state));
    } catch (e) {}
    if (artifact) {
      var doc = buildDoc();
      Promise.resolve(artifact.publish(doc)).then(function () {
        dirty = false;
        toast('Saqlandi.');
      }).catch(function () {
        toast("Saqlab bo'lmadi.");
      }).then(function () { saving = false; refreshSaveBtn(); });
    } else {
      dirty = false;
      saving = false;
      refreshSaveBtn();
      toast('Suratlar va o\'zgarishlar muvaffaqiyatli saqlandi!');
    }
  });

  function applyMode() {
    editable = true;
    try {
      var saved = localStorage.getItem('xm_saved_state') || localStorage.getItem(DRAFT);
      if (saved) {
        var d = JSON.parse(saved);
        if (d && d.v === 2 && Array.isArray(d.frames)) {
          state = normalize(d);
          applyAll();
        } else {
          localStorage.removeItem('xm_saved_state');
          localStorage.removeItem(DRAFT);
        }
      }
    } catch (e) {}
    for (var i = 0; i < frames.length; i++) drawFrame(i);
    refreshSaveBtn();
    updatePanel();
  }

  (function initCaps() {
    editable = true;
    var c = window.claude;
    if (!c || typeof c.use !== 'function') { applyMode(); return; }
    Promise.all([
      c.use('artifact').catch(function () { return null; }),
      c.use('user').catch(function () { return null; })
    ]).then(function (r) {
      artifact = r[0] || null;
      applyMode();
    }).catch(function () { applyMode(); });
  })();

  /* ---------- intro ---------- */
  el.introGo.addEventListener('click', function () {
    el.intro.hidden = true;
    if (!started) { started = true; el.introGo.textContent = 'Davom etish'; }
    syncZoneAudio(true);
  });
  el.help.addEventListener('click', function () { el.intro.hidden = false; keys = {}; });

  /* ---------- loop ---------- */
  var last = performance.now(), vel = { x: 0, z: 0 }, lastSide = 3, bumpAt = -9;
  function angDiff(a, b) { var d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }

  function update(dt, t) {
    var interactive = started && !lbOpen && el.intro.hidden && !typing() && seat.phase === 'none';
    if (!started || !el.intro.hidden) { if (!reduceMotion) camYaw += dt * 0.07; }
    var prev = { x: player.position.x, z: player.position.z };
    doorBump = false; exitBump = false;

    /* walking with a little inertia */
    var ix = 0, iy = 0;
    if (interactive) {
      ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
      iy = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y;
      var len = Math.hypot(ix, iy);
      if (len > 1) { ix /= len; iy /= len; }
    }
    var mag = Math.hypot(ix, iy), run = keys.ShiftLeft || keys.ShiftRight;
    var tvx = 0, tvz = 0;
    if (mag > 0.01) {
      var fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
      var dx = fx * iy + rx * ix, dz = fz * iy + rz * ix, dl = Math.hypot(dx, dz) || 1;
      var top = (run ? 5.0 : 2.9) * Math.min(1, mag);
      tvx = dx / dl * top; tvz = dz / dl * top;
    }
    var kv = 1 - Math.exp(-dt * (mag > 0.01 ? 9 : 14));
    vel.x += (tvx - vel.x) * kv; vel.z += (tvz - vel.z) * kv;
    if (!interactive) { vel.x = 0; vel.z = 0; }
    var sp = Math.hypot(vel.x, vel.z);
    if (sp > 0.02) {
      player.position.x += vel.x * dt; player.position.z += vel.z * dt;
      resolve(player.position, 0.38, prev);
      if (sp > 0.3) {
        player.rotation.y += angDiff(player.rotation.y, Math.atan2(vel.x, vel.z)) * Math.min(1, dt * 10);
        if (interactive) sfx.step(sp);
      }
    }
    var forced = updateSeat(dt);
    seats.forEach(function (q) { if (q.chair) { var pl = 0.28 * (1 - (curSeat === q ? sitBlend : 0)); q.chair.position.set(q.seat.x + q.out.x * pl, 0, q.seat.z + q.out.z * pl); } });
    if (seat.phase !== 'sit') { focusIdx = -1; camGoal = null; }
    else if (focusIdx < 0) {
      var bj = -1, ba = 9;
      seatFrames().forEach(function (j) { var gp = frames[j].group.position, aa = Math.abs(angDiff(player.rotation.y, Math.atan2(gp.x - player.position.x, gp.z - player.position.z))); if (aa < ba) { ba = aa; bj = j; } });
      focusIdx = bj;
    }
    var lk = 0;
    if (seat.phase === 'sit' && focusIdx >= 0) { var fp = frames[focusIdx].group.position; lk = clamp(angDiff(player.rotation.y, Math.atan2(fp.x - player.position.x, fp.z - player.position.z)), -2.0, 2.0); }
    lookRel += (lk - lookRel) * Math.min(1, dt * 4);
    animatePlayer(t, dt, interactive ? sp : forced);
    if (giftAt && t >= giftAt && !flowerGiven) { flowerGiven = true; leaveFlower(); giftAt = 0; }

    /* door and room change */
    updateDoor(dt);
    updateGarden(dt, t);
    updateZoneAudio();
    if (monitorSlides) monitorSlides.tick(t, gAmt > 0.05);
    if (doorLight) doorLight.intensity = 0.15 + 0.55 * door.amt;
    if (neonZMesh && neonZLight) {
      var neonPulse = 0.5 + 0.5 * Math.sin(t * 3.1);
      neonZMesh.scale.setScalar(0.96 + neonPulse * 0.1);
      neonZMesh.material.opacity = 0.78 + neonPulse * 0.2;
      neonZMesh.rotation.z = Math.sin(t * 1.7) * 0.035;
      neonZLight.intensity = 0.55 + neonPulse * 0.55;
    }
    if (doorBump && t - bumpAt > 2.5) { bumpAt = t; toast('Eshik yopiq. Ochish uchun E tugmasini bosing.'); }
    if (exitBump && t - bumpAt > 2.5) { bumpAt = t; toast("Bog' eshigi yopiq. Ochish uchun E tugmasini bosing."); }
    var side = sideOf(player.position.x);
    if (side !== lastSide) { lastSide = side; if (started && side === 2) toast('Maxfiy xonaga xush kelibsiz.'); if (started && side === 3) toast("Bog'ga xush kelibsiz. Fontan yonidagi o'rindiqlarda dam oling."); }

    /* camera stays inside the room the player is in */
    if (seat.phase === 'walk' || seat.phase === 'turn' || seat.phase === 'down') camYaw += angDiff(camYaw, curSeat ? curSeat.cam : Math.PI / 2 - 0.3) * Math.min(1, dt * 1.6);
    if (seat.phase === 'sit' && camGoal !== null) camYaw += angDiff(camYaw, camGoal) * Math.min(1, dt * 2.2);
    var cp = Math.cos(camPitch), px = player.position.x, pz = player.position.z;
    var cx = px + Math.sin(camYaw) * cp * camDist, cz = pz + Math.cos(camYaw) * cp * camDist, ceil;
    if (side === 1) { cx = clamp(cx, -9.5, HW - 0.5); cz = clamp(cz, -HD + 0.5, HD - 0.5); ceil = WALL_H; }
    else if (side === 2) { cx = clamp(cx, R2.x0 + 0.5, -10.8); cz = clamp(cz, -4.5, 4.5); ceil = R2.h; }
    else { cx = clamp(cx, GARDEN.x0 + 3, -21.0); cz = clamp(cz, -GARDEN.hz + 3.5, GARDEN.hz - 3.5); ceil = 12; }
    var cy = clamp(1.5 + Math.sin(camPitch) * camDist, 1.1, ceil - 0.4);
    var k = 1 - Math.pow(0.0008, dt);
    camera.position.x += (cx - camera.position.x) * k;
    camera.position.y += (cy - camera.position.y) * k;
    camera.position.z += (cz - camera.position.z) * k;
    camera.lookAt(px, 1.35 - 0.18 * sitBlend, pz);

    /* candles, dust, petals */
    var fl = 1 + Math.sin(t * 9) * 0.07 + Math.sin(t * 23.7) * 0.05;
    candleLight.intensity = 0.8 * fl;
    if (candle2) candle2.intensity = 0.95 * (1 + Math.sin(t * 8.3) * 0.07 + Math.sin(t * 21.1) * 0.05);
    flames.forEach(function (f, n) { var s = 0.34 * (1 + Math.sin(t * 11 + n * 2) * 0.1 + Math.sin(t * 27 + n) * 0.06); f.scale.set(s, s, 1); });
    for (var i = 0; i < dustPos.length; i += 3) {
      dustPos[i] += Math.cos(t * 0.2 + i) * 0.0014;
      dustPos[i + 1] += Math.sin(t * 0.3 + i * 0.7) * 0.0012;
      dustPos[i + 2] += Math.sin(t * 0.25 + i * 1.3) * 0.0014;
    }
    dust.geometry.attributes.position.needsUpdate = true;
    if (petals) {
      for (var q = 0; q < petalSpeed.length; q++) {
        petalPos[q * 3 + 1] -= petalSpeed[q] * dt;
        petalPos[q * 3] += Math.sin(t * 0.8 + q) * 0.004;
        petalPos[q * 3 + 2] += Math.cos(t * 0.6 + q * 1.7) * 0.004;
        if (petalPos[q * 3 + 1] < 0.05) petalPos[q * 3 + 1] = q < PETAL_R1 ? WALL_H - 0.3 : R2.h - 0.3;
      }
      petals.geometry.attributes.position.needsUpdate = true;
    }

    if (letterGlow) {
      letterGlow.position.y = 1.05 + Math.sin(t * 3.2) * 0.04;
      letterGlow.scale.setScalar(0.35 + Math.sin(t * 3.2) * 0.05);
    }

    /* nearest frame in this room */
    var best = -1, bd = seat.phase === 'sit' ? 13 : 2.9;
    for (var j = 0; j < frames.length; j++) {
      if (frames[j].room !== side) continue;
      var d = Math.hypot(px - frames[j].sx, pz - frames[j].sz);
      if (d < bd) { bd = d; best = j; }
    }
    if (seat.phase === 'sit') best = -1;
    if (typing() && activeIdx >= 0) best = activeIdx;
    if (!started || !el.intro.hidden || (seat.phase !== 'none' && seat.phase !== 'sit')) best = -1;
    if (best !== activeIdx) { activeIdx = best; updatePanel(); }

    /* Ramkalar faqat foydalanuvchi E tugmasi yoki ekrandagi amal tugmasini
       bosganda ochiladi. Yaqinlashish/burilish lightboxni avtomatik ochmaydi. */
    autoShown = -1;

    /* action buttons */
    var onSeat = seat.phase === 'sit', busy = seat.phase !== 'none' && !onSeat;
    var ns = seatNear(2.7), cs = (onSeat || busy) ? curSeat : ns;
    var nearSeat = started && (onSeat || (!!ns && !busy));
    var nearDoor = started && doorNear(2.7) && seat.phase === 'none', nearExit = started && exitNear(2.7) && seat.phase === 'none';
    var nearLetter = started && seat.phase === 'sit' && curSeat && curSeat.name.indexOf('table-2-') === 0;
    var nearSlide = started && slideMonitorNear(2.8);
    el.actions.hidden = !(nearSeat || nearDoor || nearExit || nearLetter || nearSlide || busy);
    el.sit.hidden = !(nearSeat || busy); el.wave.hidden = !nearSeat || onSeat; el.give.hidden = !(nearSeat && cs && cs.gift);
    el.letterAction.hidden = !nearLetter;
    el.actionSlide.hidden = !nearSlide;
    el.sit.disabled = busy;
    el.sit.textContent = cs ? (onSeat ? cs.standLabel : cs.sitLabel) : "O'tirish";
    el.next.hidden = !nearDoor;
    el.pPrev.hidden = el.pNext.hidden = !(onSeat && seatFrames().length > 1);
    el.next.textContent = door.target ? 'Eshikni yopish' : 'Eshikni ochish';
    el.exit.hidden = !nearExit;
    el.exit.textContent = exitDoor.target ? "Bog' eshigini yopish" : "Bog'ga chiqish eshigini ochish";
    if (started && el.intro.hidden && seat.phase === 'none') {
      if (ns && ns.hint && ns !== hintSeat && t - hintAt > 4) { toast(ns.hint); hintAt = t; }
      hintSeat = ns;
    }
  }

  function loop(now) {
    requestAnimationFrame(loop);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt, now / 1000);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
})();
</script>
